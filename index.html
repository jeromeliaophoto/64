<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>360度泥偶環物攝影展示</title>
    <style>
        body { background-color: #000; color: #fff; margin: 0; }
        #openseadragon-viewer {
            width: 100%;
            height: 90vh; /* 佔據螢幕 90% 的高度 */
            background-color: #111;
        }
    </style>
</head>
<body>

    <div id="openseadragon-viewer"></div>

    <script src="js/openseadragon.min.js"></script>

    <script>
        var viewer = OpenSeadragon({
            id: "openseadragon-viewer", // 必須跟上面的 div id 一致
            prefixUrl: "osd-icons/",    // 存放放大縮小按鈕的資料夾
            sequenceMode: true,          // 開啟 360 度序列模式
            // === 加入以下這幾行優化參數 ===
    blendTime: 0,              // 1. 重要：將淡入淡出時間設為 0，消除黑色閃爍
    alwaysBlend: false,        // 2. 關閉混合模式，提升渲染速度
    autoHideControls: true,    // 3. 自動隱藏介面，減少運算負擔
    immediateRender: true,     // 4. 強制立即渲染，減少等待感
    preload: true,             // 5. 預載鄰近影格，讓旋轉更流暢
    // ===========================================
            showReferenceStrip: false,   // 隱藏下方縮圖列以保持畫面乾淨
            tileSources: [               // 這裡填入您 32 張圖片的路徑
               "tiles/set1/big_001.dzi",
    "tiles/set1/big_002.dzi",
    "tiles/set1/big_003.dzi",
    "tiles/set1/big_004.dzi",
    "tiles/set1/big_005.dzi",
    "tiles/set1/big_006.dzi",
    "tiles/set1/big_007.dzi",
    "tiles/set1/big_008.dzi",
    "tiles/set1/big_009.dzi",
    "tiles/set1/big_010.dzi",
    "tiles/set1/big_011.dzi",
    "tiles/set1/big_012.dzi",
    "tiles/set1/big_013.dzi",
    "tiles/set1/big_014.dzi",
    "tiles/set1/big_015.dzi",
    "tiles/set1/big_016.dzi",
    "tiles/set1/big_017.dzi",
    "tiles/set1/big_018.dzi",
    "tiles/set1/big_019.dzi",
    "tiles/set1/big_020.dzi",
    "tiles/set1/big_021.dzi",
    "tiles/set1/big_022.dzi",
    "tiles/set1/big_023.dzi",
    "tiles/set1/big_024.dzi",
    "tiles/set1/big_025.dzi",
    "tiles/set1/big_026.dzi",
    "tiles/set1/big_027.dzi",
    "tiles/set1/big_028.dzi",
    "tiles/set1/big_029.dzi",
    "tiles/set1/big_030.dzi",
    "tiles/set1/big_031.dzi",
    "tiles/set1/big_032.dzi"
                // ... 之後用 Python 生成的清單貼在這裡
            ]
        });
        // ====== 關鍵互動代碼 ======

// 實現滑鼠拖曳旋轉物件
viewer.addHandler('canvas-drag', function(event) {
    var deltaX = event.delta.x; // 滑鼠左右移動的距離
    var curPage = viewer.currentPage(); // 目前顯示的是第幾張泥偶
    var total = viewer.tileSources.length; // 總共有 32 張

    // 靈敏度設定：數字越小越靈敏。GFX 一億像素大圖建議設定在 2~3 之間。
    var sensitivity = 2.5; 

    if (deltaX > sensitivity) { 
        // 向右拖，顯示泥偶的「上一影格」
        viewer.goToPage((curPage - 1 + total) % total); 
    } else if (deltaX < -sensitivity) { 
        // 向左拖，顯示泥偶的「下一影格」
        viewer.goToPage((curPage + 1) % total); 
    }
});

// ====== 貼到這裡結束 ======
    </script>
</body>
</html>
