<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>360 Viewer - Ultra Smooth</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/spritespin@4.1.0/release/spritespin.js"></script>
    <style>
        body { background: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #mySpriteSpin { width: 100%; max-width: 1200px; }
    </style>
</head>
<body>

    <div id="mySpriteSpin"></div>

    <script>
        $(function() {
            // 生成 32 張圖片的路徑清單
            var frames = [];
            for (var i = 1; i <= 32; i++) {
                var num = i < 10 ? '0' + i : i;
                frames.push('images/' + num + '.jpg'); 
            }

            $("#mySpriteSpin").spritespin({
                source: frames,
                width: 3840,    // 原始圖片寬度
                height: 2845,   // 原始圖片高度
                sense: 1,       // 靈敏度，數字越小越靈敏
                responsive: true,
                animate: false,
                loop: true,
                frameTime: 40,
                onInit: function() {
                    console.log("正在加載照片...");
                },
                onProgress: function(e, progress) {
                    // 這裡可以做進度條
                    console.log("已下載: " + progress + "%");
                }
            });
        });
    </script>
</body>
</html>
